name: Framework Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest pytest-cov pylint

      - name: Lint Python files
        run: |
          pylint scripts/*.py --disable=C0111,C0103,R0913 || true
        continue-on-error: true

      - name: Test imports
        run: |
          python3 -c "from scripts import hibp_monitor"
          python3 -c "from scripts import gsc_removal_agent"
          python3 -c "from scripts import bing_removal_agent"
          python3 -c "from scripts import data_broker_automation"
          python3 -c "from scripts import monitoring_orchestrator"
          python3 -c "from scripts import automation_cli"
          echo "✓ All imports successful"

      - name: Test HIBP Monitor
        run: |
          python3 -c "
          from scripts.hibp_monitor import HIBPMonitor
          monitor = HIBPMonitor()
          print('✓ HIBP Monitor instantiated successfully')
          "

      - name: Test Data Broker Automation
        run: |
          python3 -c "
          from scripts.data_broker_automation import DataBrokerAutomation
          automation = DataBrokerAutomation({'name': 'Test', 'email': 'test@test.com'})
          plan = automation.generate_removal_plan()
          assert plan['total_brokers'] == 9
          print('✓ Data Broker Automation test passed')
          "

      - name: Test Monitoring Orchestrator
        run: |
          python3 -c "
          from scripts.monitoring_orchestrator import MonitoringOrchestrator
          orchestrator = MonitoringOrchestrator({'name': 'Test', 'email': 'test@test.com'})
          orchestrator.setup_daily_checks()
          assert len(orchestrator.monitoring_jobs) > 0
          print('✓ Monitoring Orchestrator test passed')
          "

      - name: Test Dashboard Server
        run: |
          python3 -c "
          from scripts.dashboard_server import DashboardServer
          dashboard = DashboardServer()
          html = dashboard.generate_html()
          assert 'Privacy Framework Dashboard' in html
          print('✓ Dashboard Server test passed')
          "

      - name: Test CLI
        run: |
          python3 scripts/automation_cli.py help > /dev/null
          echo "✓ CLI help command successful"

      - name: Syntax check all scripts
        run: |
          python3 -m py_compile scripts/*.py
          echo "✓ All scripts have valid Python syntax"

      - name: Check documentation
        run: |
          test -f AUTOMATION_COMPLETE.md && echo "✓ AUTOMATION_COMPLETE.md found"
          test -f AUTOMATION_GUIDE.md && echo "✓ AUTOMATION_GUIDE.md found"
          test -f GETTING_STARTED.md && echo "✓ GETTING_STARTED.md found"
          test -f QUICK_START.md && echo "✓ QUICK_START.md found"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: logs/
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop on syntax errors, but continue on style issues
          flake8 scripts/*.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 scripts/*.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
